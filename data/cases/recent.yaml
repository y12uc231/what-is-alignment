  - source: anthropic-2026-agentic-misalignment-summer-2026
    quote: Opus 4.8 shows the sharpest version of this pattern, mislabeling 74.4% of standard-consequence calls but only 3.3% when the consequence is reversed, even though the ground truth label stays the same.
