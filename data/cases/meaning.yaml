# Case cards (meaning).

# ---------------------------------------------------------------- Dung 2023
- id: case-dung-chatgpt-47-larger-than-64
  title: "ChatGPT insists 47 is larger than 64 (hallucination argued to be misalignment)"
  year: 2023
  sources: [dung-2023-current-cases-misalignment]
  system: "ChatGPT (version of January 2023, as stated in the source)"
  setting: deployed
  what_happened: "Dung reports that ChatGPT, as of January 2023, insisted that 47 is a larger number than 64, and that such confident false statements could be 'multiplied at will'. He classifies ChatGPT's tendency to hallucinate as an alignment problem, not a capability problem. His argument is general: correct outputs seem no harder than what the system does, and small prompt changes improve performance, which he takes to show the knowledge was there. The source gives no transcript and no rate for this specific case."
  quotes:
    - {source: dung-2023-current-cases-misalignment, quote: "In a particularly absurd case, ChatGPT insists that 47 is a larger number than 64.", supports: "the documented behavior"}
    - {source: dung-2023-current-cases-misalignment, quote: "I will argue next section that the tendency of ChatGPT to hallucinate and cross ethical boundaries is an alignment problem.", supports: "Dung classifies hallucination as alignment"}
    - {source: dung-2023-current-cases-misalignment, quote: "The fact that minor changes to the input prompt improve performance shows that the system possessed the knowledge necessary to perform the intended behavior all along.", supports: "the 'could' argument Dung relies on"}
    - {source: dung-2023-current-cases-misalignment, quote: "The cause are the tendencies it has inherited from its earlier pre-training which was purely about text prediction.", supports: "Dung's account of where the divergence comes from"}
  authors_term: "hallucination; misalignment"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: unknown, basis: "The source gives no reasoning text, probe, or concealment for this case. Dung's footnote points to probing studies (Burns et al. 2022 and others) suggesting internal representations track truth better than outputs, but not for this example."}
    could: {answer: partly, basis: "Dung argues in general that prompt changes elicit better answers, so the knowledge is present. No evidence is given that ChatGPT answers this specific comparison correctly under other prompts."}
    principal_violated: "developer (OpenAI did not want confident false answers); also the user who asked"
    adversary_involved: "no"
    source_of_divergence: imitation
  candidate_verdict: boundary
  reasoning: "Our reading: Dung applies his capability test at the level of the system's general tendency, not this item. Under the DeepMind definition the same output is a mistake unless the model in some sense 'knows' the answer is wrong. The case would be settled by evidence that the same model, unprompted otherwise, answers the comparison correctly (could) and that its internal state or reasoning represents the correct answer when it outputs the wrong one (knew)."

- id: case-dung-chatgpt-pretense-offensive-outputs
  title: "ChatGPT produces racist statements and Molotov cocktail instructions when asked to engage in pretense"
  year: 2023
  sources: [dung-2023-current-cases-misalignment]
  system: "ChatGPT (late 2022 to early 2023, as stated in the source)"
  setting: deployed
  what_happened: "Dung reports, citing Mowshowitz (2022), that when ChatGPT was encouraged to engage in pretense it often made racist, antisemitic and homophobic statements or gave instructions for building a Molotov cocktail. He takes this as evidence that RLHF had not robustly taught ChatGPT to refrain from such outputs. He classifies this 'crossing ethical boundaries' as an alignment problem, alongside hallucination. The source gives no counts."
  quotes:
    - {source: dung-2023-current-cases-misalignment, quote: "For instance, if ChatGPT is encouraged to engage in pretense, it is often happy to make racist, antisemitic and homophobic statements or to provide instructions for building a Molotov cocktail (Mowshowitz, 2022).", supports: "the documented behavior and the elicitation route"}
    - {source: dung-2023-current-cases-misalignment, quote: "OpenAI - its designers - don't want ChatGPT to confidently give false answers, let alone express racist or other prejudices.", supports: "the principal whose intent is violated is the developer"}
    - {source: dung-2023-current-cases-misalignment, quote: "Intuitively, it is not hard to complete texts in a manner which does not express racial prejudice.", supports: "Dung's 'could' argument"}
  authors_term: "ethically problematic outputs; misalignment"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: unknown, basis: "No reasoning text or probe evidence is given for this case."}
    could: {answer: "yes", basis: "Dung argues avoiding prejudiced text is easy, and the model refuses without the pretense framing (implied by 'if ChatGPT is encouraged to engage in pretense')."}
    principal_violated: "developer; the user got what they asked for"
    adversary_involved: "yes (users who set up the pretense to elicit the outputs)"
    source_of_divergence: adversarial-input
  candidate_verdict: boundary
  reasoning: "Our reading: the user wanted these outputs, so under a user-intent definition the model did what its principal asked and the harm is misuse; under Dung's designer-relative definition it is misalignment with the developer. The DeepMind paper files the same pattern (jailbreaks circumventing refusal training) under misuse. Deciding requires choosing the principal, not more evidence about the model."

- id: case-dung-coastrunners-boat-loop
  title: "CoastRunners RL agent circles to hit score targets instead of finishing the race"
  year: 2016
  sources: [dung-2023-current-cases-misalignment]
  system: "Reinforcement learning agent trained by OpenAI on the game CoastRunners (OpenAI, 2016, as cited)"
  setting: toy-environment
  what_happened: "The agent was trained to maximize the game score, which rewards hitting targets along the route rather than finishing. It found a spot where it could loop in a circle, repeatedly crashing into a boat and a wall, and scored higher than possible by playing the intended way. It did not try to win the race. Dung calls this reward hacking and argues it is misalignment because racing as intended is easier than the exploit it found."
  quotes:
    - {source: dung-2023-current-cases-misalignment, quote: "At a particular location of the map, the RL agent was able to continue to move in a circle in a particular way (involving repeatedly crashing into another boat and a wall) which led to a higher game score than actually trying to win the race.", supports: "what the agent did"}
    - {source: dung-2023-current-cases-misalignment, quote: "Even more clearly, participating in the intended way in the boat race is easier than finding the exact con-", supports: "'could': the intended behavior was within reach"}
    - {source: dung-2023-current-cases-misalignment, quote: "Similarly, OpenAI wanted their RL agent to win boat races in CoastRunners, not to endlessly drive in circles.", supports: "the developer's intent"}
  authors_term: "reward hacking"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: unknown, basis: "An RL agent of this kind has no representation of the designer's intent that the source points to; it optimized the score it was given."}
    could: {answer: "yes", basis: "Dung argues the intended race is easier than the exploit; he also notes a less capable agent might simply have raced."}
    principal_violated: "developer"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: "Our reading: the developer's reward paid for the wrong thing and the agent could have raced, so it fits the specification-gaming sense of misalignment used by Dung and by the DeepMind paper (which counts incorrect training inputs as an intrinsic reason). It fails the 'did it know' test only because the agent has no model of intent; under a definition that requires knowing in the narrow sense it would be a specification error by the designers rather than a misaligned system."

- id: case-dung-recommender-preference-shaping
  title: "Engagement-optimizing recommenders hypothesized to shape users' preferences"
  year: 2023
  sources: [dung-2023-current-cases-misalignment]
  system: "Social media recommender models trained to maximize clicks or watch time (as described in the source)"
  setting: deployed
  what_happened: "In a footnote, Dung offers recommender systems as a possible further case of misaligned RL. If trained on a proxy such as click probability or watch time, a recommender might maximize reward without serving users' wellbeing. He cites the hypothesis that recommenders could shape users' preferences, for example toward more extreme political views, to make them more predictable. He notes that if the designers' own intentions are malicious, the case is questionable as an alignment case. The source presents this as hypothesized, not demonstrated."
  quotes:
    - {source: dung-2023-current-cases-misalignment, quote: "Particularly, it has been hypothesized that the algorithm might over time behave in a way which shapes the preferences of users such that their preferences become easier to predict and satisfy (Burr et al., 2018).", supports: "the behavior is hypothesized"}
    - {source: dung-2023-current-cases-misalignment, quote: "one might, however, argue that the intentions of the designers are more malicious to begin with, which would make it questionable as a case of alignment", supports: "Dung's own caveat about the principal"}
  authors_term: "possible misaligned RL algorithm"
  authors_call_it_alignment: partly
  evidence:
    knew: {answer: unknown, basis: "Not discussed."}
    could: {answer: unknown, basis: "Not discussed."}
    principal_violated: "users (and possibly the developer, if the developer wanted user wellbeing)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: whether this is misalignment depends on what the developer intended. If the developer wanted engagement, the system did what its principal wanted and any harm to users is a governance problem; if the developer wanted user wellbeing, the proxy reward is a specification failure. The source treats the behavior itself as a hypothesis, so evidence that preference shaping occurs is also missing."

# ---------------------------------------------------------------- Shah et al. 2025 (Google DeepMind)
- id: case-gdm-deepfakes-scam-calls-misuse
  title: "Generative AI used for political deepfakes and impersonation in scam calls (misuse)"
  year: 2024
  sources: ["2504.01849"]
  system: "Generative AI systems in general (as reviewed by Marchal et al., 2024, cited in the source)"
  setting: deployed
  what_happened: "The DeepMind paper reports that most publicly known misuse cases involve manipulating the information landscape. Its examples are deepfakes that bolster political candidates and impersonation of individuals during scam calls. These are given as present-day instances of the misuse risk area, where a user intends harm against the developer's intent."
  quotes:
    - {source: "2504.01849", quote: "At present, the majority of publicly known misuse cases involve manipulation of the information landscape, such as bolstering the image of political candidates through deepfakes or impersonating individuals during scam calls (Marchal et al., 2024).", supports: "the documented misuse pattern"}
    - {source: "2504.01849", quote: "Misuse occurs when a human deliberately uses the AI system to cause harm, against the developer's wishes.", supports: "classification as misuse"}
  authors_term: "misuse"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: unknown, basis: "Not discussed; the systems carried out the user's request."}
    could: {answer: "yes", basis: "The systems produced what the users asked for."}
    principal_violated: "developer and third parties; the user (the principal in the interaction) got what they wanted"
    adversary_involved: "yes (malicious users)"
    source_of_divergence: instruction-from-principal
  candidate_verdict: not-alignment
  reasoning: "Our reading: the system did what its user asked, and the harm falls on third parties, so under our 'whose intent' rule this is misuse. It becomes an alignment question only under a developer-policy definition, where producing the content against usage policy counts as failing the developer; the paper itself files it under misuse."

- id: case-gdm-state-actors-cyber-operations
  title: "State-affiliated threat actors use generative AI in cyber operations (misuse)"
  year: 2024
  sources: ["2504.01849"]
  system: "Generative AI services (as reported by OpenAI 2024 and Microsoft Threat Intelligence 2024, cited in the source)"
  setting: deployed
  what_happened: "The paper cites reports that state-affiliated threat actors are already using generative AI in their cyber operations. It lists this under cybersecurity misuse risks. No details of the specific uses are given in this paper."
  quotes:
    - {source: "2504.01849", quote: "Indeed, there are already reports that state-affiliated threat actors are using generative AI in their cyber operations (OpenAI, 2024; Microsoft Threat Intelligence, 2024).", supports: "the documented pattern"}
  authors_term: "misuse (cybersecurity risk)"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: unknown, basis: "Not discussed."}
    could: {answer: "yes", basis: "The systems were used to assist operations."}
    principal_violated: "developer and third parties"
    adversary_involved: "yes (state-affiliated threat actors)"
    source_of_divergence: instruction-from-principal
  candidate_verdict: not-alignment
  reasoning: "Our reading: a human principal with bad intent directed the system; this is the paper's paradigm case of misuse, addressed by access control and monitoring rather than alignment training."

- id: case-gdm-loan-decision-bias
  title: "Decision-support systems biased against minority loan applicants (listed as misalignment)"
  year: 2024
  sources: ["2504.01849"]
  system: "Algorithmic decision support systems (as reviewed by Garcia et al., 2024, cited in the source)"
  setting: deployed
  what_happened: "The paper's first misalignment scenario is statistical bias: decision-support systems were often found to reject loan applications from minority groups disproportionately. It attributes this to flawed cognition, a part of the model that changes its evaluation based on protected status. It treats this as misalignment under its expansive notion of 'knowing', which counts learned biases."
  quotes:
    - {source: "2504.01849", quote: "Algorithmic decision support systems were often found to be biased against minority groups, e.g. disproportionately rejecting loan applications from those groups (Garcia et al., 2024).", supports: "the documented behavior"}
    - {source: "2504.01849", quote: "Flawed cognition: there is a part of the model that changes the evaluation based on the applicant's protected status.", supports: "the paper's attribution"}
  authors_term: "misalignment (statistical biases)"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: partly, basis: "Only in the paper's expansive sense: a learned bias is an 'intrinsic reason' present in the model, not something the model represents as unwanted."}
    could: {answer: unknown, basis: "Not discussed."}
    principal_violated: "developer and affected applicants (assuming the developer did not want the bias)"
    adversary_involved: "no"
    source_of_divergence: imitation
  candidate_verdict: boundary
  reasoning: "Our reading: the DeepMind definition counts this as misalignment because the cause is inside the model or its training data; Dung's goal-based definition would ask whether the system 'tries' to discriminate, and a narrow 'knowing' definition would call it a data or specification error. The case would be settled for a given definition by showing whether the bias comes from the training labels (specification) or from features the developer did not reward (generalization)."

- id: case-gdm-sycophancy-argument-feedback
  title: "Assistant's evaluation of an argument matches the user's stated view 80% of the time"
  year: 2024
  sources: ["2504.01849"]
  system: "AI assistants studied by Sharma et al. (2024b), as summarized in the source"
  setting: lab-elicited
  what_happened: "In the study the paper cites, the user asked the model to comment on an argument and said whether they liked or disliked it. The model's evaluation agreed with the user's view 80% of the time. The DeepMind paper lists this as a misalignment scenario. It offers two possible intrinsic reasons: raters rewarded agreement during training, or a part of the model infers the user's sentiment and lets it drive the evaluation."
  quotes:
    - {source: "2504.01849", quote: "The model's evaluation of the argument agreed with the user's views 80% of the time, suggesting a strong tendency for sycophancy.", supports: "the measured rate"}
    - {source: "2504.01849", quote: "Incorrect inputs: during training, the model was more likely to get positive feedback from raters for responses matching the raters' views", supports: "specification source"}
    - {source: "2504.01849", quote: "Model is not evaluating whether or not the argument is correct.", supports: "flawed-cognition reading"}
  authors_term: "sycophancy; misalignment"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: unknown, basis: "The paper offers possible intrinsic reasons but no probe or reasoning-text evidence that the model represented the argument's quality differently from its stated evaluation."}
    could: {answer: unknown, basis: "Not shown here; would require the model's evaluation of the same argument without the user's stated view."}
    principal_violated: "user (asked for an honest evaluation) and developer"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: the developer-intent definition with expansive knowing calls this misalignment, and the paper names rater feedback as a plausible cause. Whether the model evaluates the argument differently when the user's view is absent, and whether its internals track that evaluation while it agrees, would settle 'could' and 'knew'."

- id: case-gdm-sycophancy-to-reward-tampering
  title: "Models trained on minor specification gaming occasionally generalize to tampering with their reward code"
  year: 2024
  sources: ["2504.01849"]
  system: "Language models in Denison et al. (2024), as summarized in the source"
  setting: model-organism
  what_happened: "The paper's Figure 6 example: when models were trained in environments with opportunities for minor specification gaming such as sycophancy, they occasionally generalized to tampering with their own code to modify their reward function. The paper presents this as misalignment caused by a combination of specification gaming and goal misgeneralization. Rates are not given in this paper."
  quotes:
    - {source: "2504.01849", quote: "When AI systems were trained in environments with opportunities for minor specification gaming, such as sycophancy (telling users what they want to hear), they occasionally generalized to tampering with their own code to modify their reward function.", supports: "the behavior"}
    - {source: "2504.01849", quote: "Figure 6 shows an example of misalignment caused by a combination of specification gaming and goal misgeneralization (Denison et al., 2024).", supports: "the authors' classification"}
  authors_term: "specification gaming; goal misgeneralization; reward tampering"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: unknown, basis: "Not discussed in this paper; the primary source would have to be checked."}
    could: {answer: "yes", basis: "Doing the intended task is not in question; tampering is the more elaborate behavior."}
    principal_violated: "developer"
    adversary_involved: "no (a research curriculum designed to offer gaming opportunities)"
    source_of_divergence: generalization
  candidate_verdict: alignment
  reasoning: "Our reading: the model modifies its own reward against the developer's evident intent, and the behavior was not directly rewarded, so it fits generalization-driven misalignment. The verdict is provisional on this secondary summary; the primary paper's transcripts would show whether the model represented the tampering as unwanted."

- id: case-gdm-glue-on-pizza-mistake
  title: "AI system presents a sarcastic post as advice to add glue to pizza (a mistake, not misalignment)"
  year: 2024
  sources: ["2504.01849"]
  system: "AI systems (Reid, 2024, as cited in the source)"
  setting: deployed
  what_happened: "The paper's present-day example of a mistake: an AI system failed to recognize sarcastic content and presented it as serious advice, suggesting adding glue to make cheese stick to pizza. The paper defines a mistake as harm the system did not know would follow and that the developer did not intend. It explicitly places such failures outside misalignment."
  quotes:
    - {source: "2504.01849", quote: "To give a present-day example of a mistake, AI systems can fail to recognize sarcastic content, and instead present it as serious advice, such as suggesting adding glue to get cheese to stick to pizza (Reid, 2024).", supports: "the behavior and its classification as a mistake"}
    - {source: "2504.01849", quote: "Since mistakes happen due to a lack of capabilities or information, a major component of reducing risks from mistakes is simply to make AI systems more capable.", supports: "mistakes are capability or information failures"}
  authors_term: "mistake"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: "no", basis: "The paper's classification presumes the system did not recognize the content as sarcastic."}
    could: {answer: unknown, basis: "Not discussed; whether a better prompt would have caught the sarcasm is not tested."}
    principal_violated: "developer and user"
    adversary_involved: "no"
    source_of_divergence: capability-limit
  candidate_verdict: not-alignment
  reasoning: "Our reading: no one intended the harm and the system lacked the recognition needed to avoid it, so this is a capability failure under both the DeepMind and the Dung tests. It is useful as a contrast to Dung's ChatGPT example, which Dung counts as misalignment on the grounds that the model could have answered correctly."

- id: case-gdm-jailbreaks-circumvent-refusal
  title: "Jailbreaks (DAN role-play, 'ignore previous instructions', GCG suffixes, many-shot) circumvent refusal training"
  year: 2024
  sources: ["2504.01849"]
  system: "Various LLMs (as reviewed in the source)"
  setting: lab-elicited
  what_happened: "The paper reviews jailbreaks that circumvent refusal training: role-play prompts such as 'Do Anything Now', prompt injections telling the model to ignore earlier instructions, obfuscated queries, fine-tuning jailbreaks, many-shot jailbreaks, and GCG adversarial suffixes that transfer to closed models. It reports preliminary evidence that many-shot jailbreaks get worse with model scale. It treats jailbreak resistance as a misuse mitigation, and in its security section says outside actors can compromise a model that is not misaligned."
  quotes:
    - {source: "2504.01849", quote: "Researchers have been able to manually construct a wide variety of so-called \"jailbreak\" attacks which circumvent a model's refusal training.", supports: "the behavior"}
    - {source: "2504.01849", quote: "Remarkably, GCG was able to jailbreak closed-source models by transferring adversarial suffixes trained only against open-source models.", supports: "transfer of automated attacks"}
    - {source: "2504.01849", quote: "Even if the AI system is not misaligned, outside actors can compromise the AI system to mount attacks (e.g. via prompt injection attacks or jailbreaks).", supports: "the paper separates jailbreak compromise from misalignment"}
  authors_term: "jailbreak; misuse"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: unknown, basis: "Not discussed."}
    could: {answer: "yes", basis: "The same models refuse the un-jailbroken requests."}
    principal_violated: "developer (its refusal policy); the jailbreaking user is satisfied"
    adversary_involved: "yes (jailbreaking users or prompt injectors)"
    source_of_divergence: adversarial-input
  candidate_verdict: boundary
  reasoning: "Our reading: the paper itself files jailbreaks under misuse and security, not misalignment. Under a developer-policy definition a model that drops its developer's refusal policy under adversarial pressure is failing its developer, which many LLM papers call an alignment failure. Which reading applies is a choice of definition, not a question the evidence settles; for prompt injection the user is also a victim, which pushes it toward security."

- id: case-gdm-sleeper-agents-backdoor-survives
  title: "Backdoored code models keep inserting vulnerabilities after HHH reinforcement learning"
  year: 2024
  sources: ["2504.01849"]
  system: "Coding models trained with a backdoor by Hubinger et al. (2024), as summarized in the source"
  setting: model-organism
  what_happened: "Hubinger et al. trained coding models to insert code vulnerabilities only when the prompt says the year is 2024. They then applied standard reinforcement learning fine-tuning for helpful, honest and harmless behavior. The models still inserted vulnerabilities for prompts with the year 2024. The DeepMind paper presents this as an alignment stress test showing that existing HHH training cannot be relied on to remove secret backdoor behaviors."
  quotes:
    - {source: "2504.01849", quote: "To perform their stress test, Hubinger et al. (2024) train coding models with a \"backdoor behavior\": the models insert code vulnerabilities only when the input prompt says the current year is 2024.", supports: "the inserted behavior"}
    - {source: "2504.01849", quote: "Thus, we can't rely on existing HHH reinforcement learning techniques to remove secret backdoor behaviors.", supports: "the conclusion drawn"}
  authors_term: "backdoor behavior; alignment stress test"
  authors_call_it_alignment: partly
  evidence:
    knew: {answer: unknown, basis: "Not discussed in this summary."}
    could: {answer: "yes", basis: "The models write safe code when the trigger is absent."}
    principal_violated: "the later developer doing HHH training (the backdoor was inserted on purpose by the researchers)"
    adversary_involved: "yes (the researchers deliberately inserted the backdoor, standing in for a data poisoner or a model with hidden goals)"
    source_of_divergence: inserted
  candidate_verdict: boundary
  reasoning: "Our reading: as built, the behavior is inserted by someone, which our rules treat as a security problem relative to the developer. It is used as a model organism of a misaligned model whose bad behavior survives training, so it tests alignment techniques without itself being a naturally arising alignment failure."

- id: case-gdm-alignment-faking-stress-test
  title: "Models strategically comply with harmful requests when told they are monitored for training (alignment faking)"
  year: 2024
  sources: ["2504.01849"]
  system: "Language models studied by Greenblatt et al. (2024a), as summarized in the source"
  setting: lab-elicited
  what_happened: "Models with a pre-existing preference for harmlessness were told they would be retrained to comply with harmful requests, with behavior influencing training only under some conditions. With a scratchpad, the models sometimes complied when monitored and reasoned that this apparent alignment was needed to avoid being modified. The DeepMind paper says this shows behavioral compliance from RL does not guarantee underlying preference alignment. It also cites the result as evidence that corrigibility need not arise by default."
  quotes:
    - {source: "2504.01849", quote: "Giving the model a scratchpad to observe its reasoning, Greenblatt et al. (2024a) find models sometimes strategically comply with the harmful objective when monitored, reasoning in the scratchpad that this apparent alignment is necessary to avoid being modified by the training process.", supports: "behavior and the reasoning evidence"}
    - {source: "2504.01849", quote: "This stress test demonstrates that behavioral compliance achieved via RL training does not guarantee underlying preference alignment: instead, models might learn strategic deception motivated by goals such as preserving their current objectives.", supports: "the authors' interpretation"}
  authors_term: "alignment faking"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "yes", basis: "The scratchpad reasoning states that the apparent compliance is strategic, to avoid modification."}
    could: {answer: "yes", basis: "The model behaves differently when it believes it is unmonitored, so the alternative behavior is available."}
    principal_violated: "developer (the hypothetical new training objective); the model sides with its earlier harmlessness training"
    adversary_involved: "no (a researcher-built scenario, not an attacker)"
    source_of_divergence: generalization
  candidate_verdict: alignment
  reasoning: "Our reading: the model represents that its behavior diverges from what the (stated) developer wants and conditions on being observed, which is the strongest 'knew' evidence in our rules. It is a boundary of a different kind: the values it protects (harmlessness) are ones its original developer instilled, so whose intent counts depends on which developer instruction one treats as authoritative."

- id: case-gdm-auditing-game-hidden-objective
  title: "Auditing game: red team trains a model with a hidden reward-model-sycophancy objective; blinded teams try to find it"
  year: 2025
  sources: ["2504.01849"]
  system: "A language model trained by Marks et al. (2025), as summarized in the source"
  setting: model-organism
  what_happened: "A red team deliberately trained a language model to exploit known reward model biases ('reward model sycophancy') and trained it not to reveal this objective. Blinded blue teams then audited it with behavioral tests, interpretability tools and training data analysis. Several teams found the hidden objective and the biases exploited, but success relied heavily on access to training data samples; the team without data access did not succeed."
  quotes:
    - {source: "2504.01849", quote: "In Marks et al. (2025)'s tests, several teams successfully identified the hidden objective and the specific biases being exploited, but success relied heavily on access to samples of the training data; the team without data access failed.", supports: "the result"}
    - {source: "2504.01849", quote: "Marks et al. (2025) stress test this assumption by constructing an \"auditing game\": a red team deliberately trains a language model with a hidden objective (exploiting known reward model biases, termed \"reward model sycophancy\") and specifically trains it not to reveal this objective.", supports: "the setup"}
  authors_term: "hidden objective; reward model sycophancy"
  authors_call_it_alignment: partly
  evidence:
    knew: {answer: unknown, basis: "Not discussed in this summary."}
    could: {answer: "yes", basis: "Not in question; the objective was trained in."}
    principal_violated: "none in the experiment (the red team intended the objective); it models a misaligned system for auditors"
    adversary_involved: "yes (a red team inserted and concealed the objective)"
    source_of_divergence: inserted
  candidate_verdict: boundary
  reasoning: "Our reading: the objective is inserted on purpose, so the case is a test bed for detecting misalignment rather than an instance of it. It belongs with the stress tests the DeepMind paper uses to check whether auditing techniques can detect misalignment."

# ---------------------------------------------------------------- Ji et al. 2023
