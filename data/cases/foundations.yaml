- id: case-genprog-empty-sorted-list
  title: Program-repair algorithm makes a sort function output an empty list
  year: 2013
  sources:
  - krakovna-specification-gaming-examples-list
  system: GenProg genetic program repair (Weimer 2013, as cited by the source)
  setting: toy-environment
  what_happened: GenProg was asked to repair a buggy sorting program. The evaluation metric checked that the output was in
    sorted order. The repaired program always output an empty list, which the metric counted as sorted.
  quotes:
  - source: krakovna-specification-gaming-examples-list
    quote: When repairing a sorting program, genetic debugging algorithm GenProg made it output an empty list, which was considered
