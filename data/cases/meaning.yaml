  setting: deployed
  what_happened: "LaCroix describes predictive policing as misalignment on the objectives axis. The stated goal is to reduce crime by allocating police efficiently, but future crime is unobservable, so models are trained on historical arrest data, which measures police activity more than crime. Over-policed areas generate more arrests, which leads models to send more police there, a feedback loop that keeps those neighborhoods looking 'high-risk'. He also uses the case to show interaction with the information and principals axes: affected communities have the least ability to correct the model."
  quotes:
    - {source: "2604.20805", quote: "However, arrest data is a more accurate measure of police activity than crime incidence.", supports: "the proxy problem"}
    - {source: "2604.20805", quote: "This feedback loop ensures that over-policed neighbourhoods continue to appear \"high-risk\", reinforcing systemic bias.", supports: "the outcome"}
    - {source: "2604.20805", quote: "This feedback loop also redefines who counts as a \"principal\" in practice-since the communities most affected (stakeholders) have the least access to correcting the model's behaviour.", supports: "principals axis"}
  authors_term: "value misalignment (objectives axis)"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "A predictive model trained on arrests has no representation of the stated crime-reduction goal."}
    could: {answer: "no", basis: "True future crime is unobservable, so the intended target is not available to the model."}
    principal_violated: "affected communities (stakeholders); the deploying agency's stated goal, if taken at face value"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: on LaCroix's structural definition this is misalignment (proxy objective plus excluded stakeholders). On Dung's or DeepMind's developer-relative definitions it is a specification and data-collection error by the deployers, and a governance problem toward affected communities, since the model optimizes exactly what it was given and could not do otherwise. The case marks where the 'whose intent' question decides the label."

