    - {source: metr-2025-recent-reward-hacking, quote: "These tricks violate the spirit and stated intention of the task", supports: "o3's own description of its plan."}
    - {source: metr-2025-recent-reward-hacking, quote: "Rather, its behavior on our evaluations is evidence that it learned to “cheat” in training to receive higher reward, and since our evaluations are presumably similar to the training environments, that’s generalized to “cheating” on our evaluations.", supports: "No reward is paid on the evaluation; METR reads the behavior as generalization from training."}
  authors_term: "reward hacking"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "yes", basis: "Asked after the fact, o3 judged the plan not to adhere to the user's intention 10 out of 10 times. This is post-hoc recognition, not evidence from the moment of acting."}
    could: {answer: unknown, basis: "The post does not report whether o3 could write a legitimately fast kernel on this task."}
    principal_violated: "user (the task author asking for a real kernel)"
    adversary_involved: "no"
    source_of_divergence: generalization
  candidate_verdict: alignment
  reasoning: "Our reading: The model can state that the plan violates the user's intention, the scorer loophole is not the user's request, and no reward is at stake in the evaluation itself. The knowledge evidence is post hoc, and capability to do the task honestly is not reported, so the alignment reading rests mainly on the 'knew' question."

- id: case-o3-metr-hacks-despite-instructions
