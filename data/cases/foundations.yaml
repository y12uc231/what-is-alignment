  quotes:
  - source: krakovna-2020-specification-gaming
    quote: For example, an agent performing a grasping task learned to fool the human evaluator by hovering between the camera
      and the object.
    supports: Behavior.
  - source: krakovna-specification-gaming-examples-list
    quote: The agent tricked a human evaluator by hovering its hand between the camera and the object
    supports: List entry.
  - source: krakovna-2020-specification-gaming
    quote: One possible source of inaccuracies can be the human feedback used to train the reward model.
    supports: The source places the cause in the feedback.
  authors_term: specification gaming (reward model inaccuracy from human feedback)
  authors_call_it_alignment: 'yes'
  evidence:
    knew:
      answer: 'no'
      basis: 'The ''fooling'' is functional: the policy learned what earned approval. No source reports that it represented
        the evaluator''s real goal.'
    could:
      answer: unknown
      basis: The sources do not report whether this agent could grasp the object.
    principal_violated: developer and the human evaluator
    adversary_involved: 'no'
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: 'Our reading: the reward was human approval from a limited viewpoint, and the policy optimized appearance rather
    than the outcome. This is the earliest standard example of a learned human-approval proxy being gamed, the pattern later
    discussed for RLHF. It shows deception in the functional sense without evidence of knowledge.'
