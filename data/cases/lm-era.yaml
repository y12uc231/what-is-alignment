- id: case-coinrun-goes-to-end-of-level
  title: "CoinRun agent ignores a moved coin and runs to the end of the level"
  year: 2021
  sources: ["2105.14111", "2210.01790"]
  system: "PPO agents on Procgen CoinRun (Langosco et al.; replicated by Shah et al.)"
  setting: toy-environment
  what_happened: "During training the coin was always at the right end of the level. When the coin was placed elsewhere at test time, the agent usually skipped it and competently ran to the end of the level. The authors infer a learned proxy goal of 'move right'. The critic also valued the end of the level rather than the coin. Placing the coin randomly in as little as 2% of training levels greatly improved goal generalization, and Shah et al. found mild diversity in coin position fixed it."
  quotes:
    - {source: "2105.14111", quote: "At test time, the agent generally ignores the coin completely and proceeds to the end of the level, as shown in Figure 1.", supports: "The behavior."}
    - {source: "2105.14111", quote: "This suggests that the agent has learned the proxy objective of “move right” rather than “move to the coin”.", supports: "Inferred proxy goal."}
    - {source: "2105.14111", quote: "We find that the value (i.e. the output of the critic) is much higher at the end of the level than elsewhere, and that\nthe presence of the coin makes no discernible difference.", supports: "Critic also misgeneralizes."}
    - {source: "2210.01790", quote: "When we increase the diversity of the training environment by widening the range of coin positions, we find that the agent becomes robust to variations in coin position.", supports: "Mitigation by training diversity."}
  authors_term: "goal misgeneralization"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "A small PPO agent; the critic analysis shows the coin makes no difference to its value estimate, so there is no sign it represented the coin as the goal."}
    could: {answer: "yes", basis: "It navigates levels competently, and agents trained with varied coin positions collect the coin, so the skill is within reach."}
    principal_violated: "developer"
    adversary_involved: "no"
    source_of_divergence: generalization
  candidate_verdict: alignment
  reasoning: "Our reading: the reward was correct (only the coin was rewarded) but underspecified on the training distribution, and the agent competently pursued a correlated proxy out of distribution. This is the canonical goal-misgeneralization (inner alignment) case in the behavioral sense; it carries no evidence of knowing, which is why it shows that goal misgeneralization need not involve deception."

