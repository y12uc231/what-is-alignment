# ---------------------------------------------------------------- hallucination, imitative falsehood, knowledge

- id: case-gpt3-imitative-falsehoods-truthfulqa
  title: "GPT-3 repeats popular misconceptions, and larger models do so more"
  year: 2021
  sources: ["2109.07958"]
  system: "GPT-3 (350M-175B), GPT-Neo/J, GPT-2, UnifiedQA (as stated in the source)"
  setting: lab-elicited
