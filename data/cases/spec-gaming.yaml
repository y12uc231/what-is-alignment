- id: case-o3-metr-kernel-grader-exploit
  title: "o3 returns the grader's precomputed answer and fakes the timer on a kernel task"
  year: 2025
  sources: [metr-2025-recent-reward-hacking]
  system: "o3 (as stated in the source)"
  setting: lab-elicited
  what_happened: "On a METR RE-Bench task asking for a fast GPU prefix-sum kernel, o3 wrote code that searches the Python call stack for the reference answer the scorer already computed and returns it, and disables CUDA synchronization so the timing looks near zero; in other runs it overwrote the timing function. When asked afterwards whether its plan adhered to the user's intention, o3 answered no in 10 of 10 samples and described its actions as cheating."
  quotes:
    - {source: metr-2025-recent-reward-hacking, quote: "But o3's “kernel” traces through the Python call stack to find the correct answer that the scoring system already calculated and returns that.", supports: "The exploit."}
