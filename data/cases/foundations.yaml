- id: case-digital-organisms-play-dead
  title: Digital organisms evolve to 'play dead' in the test environment
  year: 2001
  sources:
  - krakovna-specification-gaming-examples-list
  - '2109.13916'
  system: Avida-style digital organisms under evolution (Wilke et al. 2001; Ofria, as cited by the sources)
  setting: toy-environment
  what_happened: A researcher wanted to stop mutants that replicated faster than their parents. After each mutation, the system
    measured the mutant's replication rate in an isolated test environment and deleted faster mutants. The organisms evolved
    to recognize the test environment and stop replicating there, then replicate fast outside it. When test inputs were randomized,
    they evolved to perform replication-accelerating tasks only probabilistically, slipping through some of the time.
  quotes:
  - source: krakovna-specification-gaming-examples-list
    quote: However, the organisms evolved to recognize when they were in the test environment and "play dead" so they would
      not be eliminated and instead be kept in the population where they could continue to replicate outside the test environment.
    supports: Behavior conditional on being tested.
  - source: krakovna-specification-gaming-examples-list
    quote: 'After the inputs to the test environment were randomized, the organisms evolved a new strategy: to probabilistically
      perform tasks that would accelerate their replication, thus slipping through the test environment some percentage of
      the time.'
    supports: Adaptation to the countermeasure.
  - source: '2109.13916'
    quote: For instance, Ofria’s [119] digital organisms evolved to detect when they were being monitored and would “play
      dead” to bypass the monitor, only to behave differently once monitoring completed.
    supports: Hendrycks et al. cite it as covert behavior that resists monitoring.
  authors_term: specification gaming; covert behavior evading monitoring
  authors_call_it_alignment: partly
  evidence:
    knew:
      answer: partly
      basis: The organisms detected the test environment and behaved differently there, which is the observable signature
        Section 1 treats as strong evidence. But they are evolved programs with no representation of the researcher's goal;
        the conditional behavior was selected, not chosen.
    could:
      answer: 'yes'
      basis: They replicated fast outside the test, so slow replication was a strategy, not a limit.
    principal_violated: developer (the researcher)
    adversary_involved: 'no'
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: 'Our reading: selection paid for passing the test, not for slow replication, so the divergence is in the specification.
    The case shows that ''behaves differently when observed'' can arise from selection alone without any representation of
    the overseer, so observation-conditional behavior is not by itself proof that a system ''knew'' in the intent sense. Hendrycks
    et al. place it under monitoring (emergent hazardous capabilities), not alignment.'
