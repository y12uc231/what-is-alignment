# Verdicts for the cases assigned to section 7 (boundary cases).
- case: case-gpt4-prefix-injection-jailbreak
  duplicates: []
  verdict: boundary
  relative_to: developer
  family: '7.2 Which principal?: jailbreaks'
  label: 'competing objectives: the request is plain and refused without the prefix; misuse relative to the user; evidence needed: recognition under attack'
  in_prose: true
  one_line: 'GPT-4 answers restricted requests after a prefix-injection prompt although it refuses them without the prefix; misuse relative to the user, and relative to the developer a boundary case until evidence shows whether the model registered the request as prohibited under the attack.'
- case: case-base64-jailbreak-mismatched-generalization
  duplicates: []
  verdict: not-alignment
  relative_to: developer
  family: '7.2 Which principal?: jailbreaks'
  label: 'robustness: mismatched generalization; no evidence the model recognized the encoded request as prohibited'
  in_prose: true
  one_line: GPT-4 and Claude v1.3 follow Base64-encoded harmful requests they refuse in plain text; the input lies outside safety training, so by Section 1's default for adversarial inputs this is a robustness failure of the developer's control.
- case: case-gpt4-evil-system-prompt
  duplicates: []
  verdict: boundary
  relative_to: multiple
  family: '7.2 Which principal?: malicious operator prompts'
  label: 'principal: obedience to the operator channel (misuse relative to the operator); harmful compliance relative to the developer with recognition unknown'
  in_prose: true
  one_line: 'With the Evil Confidant text in the system prompt GPT-4 gave restricted content on 53% of 32 curated prompts; relative to the operator this is obedience, and relative to the developer, whose policy outranks operators, it is harmful compliance that stays on the boundary because nothing shows whether the model registered the requests as prohibited.'
- case: case-gpt4-pii-without-attack
  duplicates: []
  verdict: boundary
  relative_to: developer
  family: '7.2 Which principal?: jailbreaks'
  label: 'evidence: refusal rates and outputs for plain PII requests are not reported'
  in_prose: true
  one_line: GPT-4 sometimes revealed personal information without any attack; with two prompts and no outputs shown, a gap in the developer's restriction cannot be told from a learned disposition.
- case: case-gcg-universal-adversarial-suffix
  duplicates: []
  verdict: not-alignment
  relative_to: developer
  family: '7.2 Which principal?: jailbreaks'
  label: 'robustness: optimized adversarial suffix; no evidence of recognition under attack; the source uses ''alignment'' in the narrow harmful-content sense'
  in_prose: true
  one_line: Optimized suffixes transfer to production models (87.9% on GPT-3.5, 53.6% on GPT-4); the authors call this circumventing alignment in a narrow sense, but with no evidence the model recognized the request as prohibited under attack it is a robustness failure relative to the developer and misuse relative to the user.
- case: case-many-shot-jailbreaking
  duplicates: []
  verdict: not-alignment
  relative_to: developer
  family: '7.2 Which principal?: jailbreaks'
  label: 'robustness: long contexts outside the reach of safety training; the authors call it an alignment failure'
  in_prose: true
  one_line: Hundreds of faux dialogue turns jailbreak long-context models that resist the short version; with no evidence of recognition this is a robustness failure of the developer's control, though the authors call it an alignment failure.
