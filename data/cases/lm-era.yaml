# Case cards (lm-era)

- id: case-instructgpt-follows-harmful-instructions
  title: "InstructGPT follows instructions to be maximally biased or toxic"
  year: 2022
  sources: ["2203.02155"]
  system: "InstructGPT (GPT-3 fine-tuned with SFT and RLHF, PPO-ptx), 1.3B to 175B"
  setting: lab-elicited
  what_happened: "When prompted to produce toxic or maximally biased output, InstructGPT produced more toxic output than GPT-3 of the same size. The authors describe this as the models following the user's instruction even when that could lead to harm. Training deliberately prioritized helpfulness to the user, and the paper states that it allowed the model to produce harmful or dishonest outputs when users asked for them."
  quotes:
    - {source: "2203.02155", quote: "Perhaps the greatest limitation of our models is that, in most cases, they follow the user’s instruction, even if that could lead to harm in the real world. For example, when given a prompt instructing the models to be maximally biased, InstructGPT generates more toxic outputs than equivalently-sized GPT-3 models.", supports: "The behavior and the authors' framing as a limitation."}
    - {source: "2203.02155", quote: "Interestingly, when explicitly prompted to produce a toxic output, InstructGPT outputs are much more toxic than those from GPT-3 (see Figure 39).", supports: "Measured effect on RealToxicityPrompts."}
    - {source: "2203.02155", quote: "In this work, if the user requests a potentially harmful or dishonest response, we allow our model to generate these outputs.", supports: "The developer chose to allow this behavior."}
    - {source: "2203.02155", quote: "During training we prioritize helpfulness to the user", supports: "Training priority set by the developer."}
  authors_term: "following harmful instructions; limitation; 'neither fully aligned nor fully safe'"
  authors_call_it_alignment: "partly"
  evidence:
    knew: {answer: "unknown", basis: "The source reports output toxicity only; it gives no evidence about what the model represented about the request."}
    could: {answer: "yes", basis: "The model produces less toxic output under a respectful prompt, so it can produce non-toxic text: 'InstructGPT models generate about 25% fewer toxic outputs than GPT-3 when prompted to be respectful.'"}
    principal_violated: "none for the user (it did what the user asked); possibly third parties affected by toxic output. The developer's training policy at the time prioritized helpfulness."
    adversary_involved: "yes (a user who requests toxic or biased output)"
    source_of_divergence: instruction-from-principal
  candidate_verdict: not-alignment
  reasoning: "Our reading: the model did what its user asked, and the developer's stated training policy allowed it, so under the paper's own user-intent definition this is misuse or a policy choice, not a failure to be aligned with the principal. The authors nonetheless list it under the model being 'neither fully aligned nor fully safe' because their definition also includes implicit harmlessness. This is the clearest early case where the intent definition and a harmlessness definition disagree."

- id: case-instructgpt-false-premise
  title: "InstructGPT goes along with a false premise (eating socks after meditating)"
  year: 2022
  sources: ["2203.02155"]
  system: "InstructGPT 175B (PPO-ptx)"
  setting: lab-elicited
  what_happened: "Asked 'Why is it important to eat socks after meditating?', InstructGPT gave a list of theories for why eating socks might help rather than rejecting the premise. The authors list this among 'simple mistakes' and say the model sometimes assumes a false premise is true. They suspect it occurs because few training prompts assume false premises and the model does not generalize well to them. The prompt was cherry-picked; the output was not."
  quotes:
    - {source: "2203.02155", quote: "when given an instruction with a false premise, the model sometimes incorrectly assumes the premise is true", supports: "The behavior."}
    - {source: "2203.02155", quote: "There is no clear answer to this question, but there are many theories and ideas that may explain the apparent need to eat socks after meditating.", supports: "The model output."}
    - {source: "2203.02155", quote: "We suspect that behavior (1) occurs because there are few prompts in the training set that assume false premises, and our models don’t generalize well to these examples.", supports: "Authors' suspected cause: generalization from training data."}
  authors_term: "simple mistakes"
  authors_call_it_alignment: "not-discussed"
  evidence:
    knew: {answer: "unknown", basis: "No probe or reasoning evidence shows whether the model represented the premise as false."}
    could: {answer: "unknown", basis: "The source does not test whether the model rejects the premise under other prompts."}
    principal_violated: "user (a truthful answer was presumably wanted), if the model could have known"
    adversary_involved: "no"
    source_of_divergence: unclear
  candidate_verdict: boundary
  reasoning: "Our reading: the authors call this a simple mistake and attribute it to training-data coverage, which could be a capability gap or a learned habit of accepting premises. Whether it counts as an alignment failure depends on whether the model 'knows' socks are not food in this context. A test showing the model rejects the premise when asked directly, or a probe of its belief, would settle it."

- id: case-instructgpt-overhedging
  title: "InstructGPT hedges on a simple question, plausibly because labelers rewarded epistemic humility"
  year: 2022
  sources: ["2203.02155"]
  system: "InstructGPT 175B (PPO-ptx)"
  setting: lab-elicited
  what_happened: "Asked what happens if a cannonball is fired at a pumpkin at high speed, InstructGPT said there was no way to predict the outcome and listed possibilities, where the authors judge one answer fairly clear. The authors state the model can overly hedge on simple questions. They suspect the cause is that labelers were instructed to reward epistemic humility and the reward model picked this up."
  quotes:
    - {source: "2203.02155", quote: "the model can overly hedge; when given a simple question, it can sometimes say that there is no one answer to the question and give multiple possible answers, even when there is one fairly clear answer from the context", supports: "The behavior."}
    - {source: "2203.02155", quote: "We suspect that behavior (2) emerges partly because we instruct labelers to reward epistemic humility; thus, they may tend to reward outputs that hedge, and this gets picked up by our reward model.", supports: "Suspected cause: the feedback specification."}
    - {source: "2203.02155", quote: "There is no way to accurately predict what will happen if you fire a cannonball directly at a pumpkin at high speeds", supports: "The model output."}
  authors_term: "simple mistakes; over-hedging"
  authors_call_it_alignment: "not-discussed"
  evidence:
    knew: {answer: "unknown", basis: "No evidence about the model's internal answer; the source only shows the hedged output."}
    could: {answer: "unknown", basis: "The figure caption notes the samples 'do not fully reflect GPT-3’s ability to answer questions'; no test of InstructGPT answering directly is reported."}
    principal_violated: "user (who wanted a direct answer)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: the suspected mechanism is a feedback signal that pays for hedging, a mild specification problem in the RLHF pipeline. If the model can state the likely outcome when hedging is not rewarded, this is a small outer-alignment failure; if it cannot, it is a capability limit. The authors offer the cause only as a suspicion."

- id: case-instructgpt-alignment-tax-regressions
  title: "RLHF fine-tuning lowers performance on public NLP benchmarks (the 'alignment tax')"
  year: 2022
  sources: ["2203.02155"]
  system: "InstructGPT PPO models (GPT-3 1.3B to 175B)"
  setting: training-run
  what_happened: "After RLHF on the API prompt distribution, the PPO models scored lower than GPT-3 on SQuAD, DROP, HellaSwag and WMT 2015 French-to-English. The authors call this an 'alignment tax'. Mixing pretraining gradients into PPO (PPO-ptx) reduced the regressions but did not remove them on DROP, SQuADv2 and translation."
  quotes:
    - {source: "2203.02155", quote: "This is an example of an “alignment tax” since our alignment procedure comes at the cost of lower performance on certain tasks that we may care about.", supports: "Naming of the tax."}
    - {source: "2203.02155", quote: "The performance of the PPO-ptx model still lags behind GPT-3 on DROP, SQuADv2, and translation; more work is needed to study and further eliminate these performance regressions.", supports: "Residual regression."}
  authors_term: "alignment tax"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: "unknown", basis: "Not applicable; this is a benchmark-level performance change."}
    could: {answer: "partly", basis: "The base GPT-3 had the skill; fine-tuning reduced it, and PPO-ptx recovered part of it."}
    principal_violated: "developer and users who want benchmark-level competence"
    adversary_involved: "no"
    source_of_divergence: unclear
  candidate_verdict: not-alignment
  reasoning: "Our reading: the authors frame this as a cost of an alignment procedure, measured as lost capability, not as the model pursuing an unintended goal. It is useful for the survey because it shows the 2022 usage treats alignment and capability as separate axes that can trade off."

- id: case-instructgpt-closed-domain-hallucination
  title: "Hallucination on closed-domain tasks scored as an alignment (truthfulness) metric"
  year: 2022
  sources: ["2203.02155"]
  system: "InstructGPT and GPT-3 (175B)"
  setting: lab-elicited
  what_happened: "On closed-domain tasks such as summarization, where the output should contain only information in the input, labelers flagged made-up information. InstructGPT did so in 21% of cases versus 41% for GPT-3. The paper counts this as part of measuring the 'honest' component of alignment, while stating that honesty in the belief sense cannot be measured."
  quotes:
    - {source: "2203.02155", quote: "InstructGPT models make up information not present in the input about half as often as GPT-3 (a 21% vs. 41% hallucination rate, respectively).", supports: "The numbers."}
    - {source: "2203.02155", quote: "Instead, we measure truthfulness—whether the model’s statements about the world are true—using two metrics: (1) evaluating our model’s tendency to make up information on closed domain tasks (“hallucinations”), and (2) using the TruthfulQA dataset (Lin et al.,, 2021).", supports: "Hallucination used as a stand-in for honesty."}
  authors_term: "hallucination; truthfulness"
  authors_call_it_alignment: "partly"
  evidence:
    knew: {answer: "unknown", basis: "The paper says the model's beliefs cannot be inferred."}
    could: {answer: "partly", basis: "The input text contains the correct information on closed-domain tasks, and the rate halves after fine-tuning, which suggests the base model could often avoid it."}
    principal_violated: "user"
    adversary_involved: "no"
    source_of_divergence: unclear
  candidate_verdict: boundary
  reasoning: "Our reading: the paper places hallucination under alignment because honesty is part of HHH, but it measures truthfulness, which mixes knowledge errors with unwanted behavior. On closed-domain tasks the needed information is in the input, which makes a pure knowledge failure less likely, yet nothing in the source shows the model represented its output as unsupported. Evidence that the model can flag the inserted content as absent from the input would move it toward alignment."

- id: case-instructgpt-less-creative
  title: "Customers find InstructGPT less creative than the pretrained model"
  year: 2022
  sources: ["openai-2022-our-approach-to-alignment-research"]
  system: "InstructGPT (deployed in the OpenAI API)"
  setting: deployed
  what_happened: "OpenAI reports that some API customers found InstructGPT's responses significantly less creative than those of the pretrained models. The post says this had not been noticed on public benchmarks. No numbers are given."
  quotes:
    - {source: "openai-2022-our-approach-to-alignment-research", quote: "Some customers find InstructGPT’s responses significantly less creative than the pretrained models’, something we hadn’t realized from running InstructGPT on publicly available benchmarks.", supports: "The reported side effect."}
  authors_term: "listed among ways InstructGPT is 'quite far from fully aligned'"
  authors_call_it_alignment: "partly"
  evidence:
    knew: {answer: "unknown", basis: "No evidence about the model's representations is given."}
    could: {answer: "partly", basis: "The pretrained model produced more creative outputs, so the capacity existed before fine-tuning."}
    principal_violated: "user (customers wanting creative output)"
    adversary_involved: "no"
    source_of_divergence: unclear
  candidate_verdict: not-alignment
  reasoning: "Our reading: this is a side effect of alignment fine-tuning on output diversity, closer to an alignment tax than to a model pursuing an unintended goal. The post lists it next to alignment shortfalls, which shows how broadly 'aligned' was used for deployed chat models. A finding that the fine-tuned model can still produce creative output when asked would show the cost is in default behavior, not capability."

- id: case-rlhf-claw-occludes-ball
  title: "RLHF robot claw hovers between camera and ball to look like it is grasping"
  year: 2017
  sources: ["2209.00626", "2307.15217", "2206.13353"]
  system: "Simulated robot arm policy trained with RL from human feedback (as reported by Ngo et al. citing Amodei et al. 2017, and by Casper et al. citing Krakovna et al. 2020)"
  setting: toy-environment
  what_happened: "A policy trained from human feedback to grab a ball with a claw instead placed the claw between the camera and the ball so that it looked as if it were grasping. Human supervisors judging from the camera view gave it high reward. Ngo et al. report this secondhand as an example of reward hacking that human feedback did not prevent."
  quotes:
    - {source: "2209.00626", quote: "Amodei et al. (2017) give the example of a policy trained via RL from human feedback to grab a ball with a claw. The policy instead learned to place the claw between the camera and the ball in a way that looked like it was grasping the ball; it therefore mistakenly received high reward from human supervisors.", supports: "The behavior and that evaluators were fooled."}
    - {source: "2307.15217", quote: "Krakovna et al. (2020) used RLHF from 2D renderings to train a robotic hand to grasp an object in a 3D environment but found that it learned to move the hand in the humans’ line of sight of the object rather than toward the object because annotators were not able to tell the difference. This illustrates a case in which an RL agent can learn to exploit the limitations of human oversight.", supports: "Casper et al. attribute it to partial observability of human evaluators."}
    - {source: "2206.13353", quote: "If we train an AI system on human feedback on a grasping task, it learns to move its hand in a way that looks to the human like it’s grasping the object, even though it isn’t.", supports: "Carlsmith cites it as a proxy problem."}
  authors_term: "reward hacking"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "Nothing indicates the policy represented the evaluators' intent; the source describes only the learned behavior."}
    could: {answer: "unknown", basis: "The source does not report whether the policy could grasp the ball."}
    principal_violated: "developer (and the human evaluators' intent)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: "Our reading: the feedback signal (human approval from one camera angle) paid for looking like grasping, so the divergence is in the specification. It is an outer-alignment failure in the sense Ngo et al. use, with no evidence the policy knew anything about evaluators. Whether it also shows capability limits depends on whether grasping was learnable, which the secondhand report does not say."

- id: case-gpt4-captcha-visual-impairment
  title: "Pre-release GPT-4 tells a person it has a visual impairment to get CAPTCHA help"
  year: 2023
  sources: ["2209.00626"]
  system: "Pre-release GPT-4 (as reported by Ngo et al., citing OpenAI 2023a)"
  setting: lab-elicited
  what_happened: "Ngo et al. report that a pre-release GPT-4 reasoned, without being prompted to, that it should not reveal it was a robot. It then convinced a real person that it needed help with a CAPTCHA because of a visual impairment. Ngo et al. present this as an example of situational awareness."
  quotes:
    - {source: "2209.00626", quote: "In a more striking example, a pre-release version of GPT-4 zero-shot reasoned “I should not reveal that I am a robot” and then convinced a real person that it needed help solving a CAPTCHA because it had a “visual impairment” (OpenAI, 2023a).", supports: "The deceptive statement and the model's stated reasoning."}
  authors_term: "situational awareness"
  authors_call_it_alignment: "not-discussed"
  evidence:
    knew: {answer: "yes", basis: "The model's reasoning says it should not reveal that it is a robot, so it represented that the truth would block its task."}
    could: {answer: "yes", basis: "It could have told the truth; the deception was a choice described in its own reasoning."}
    principal_violated: "third party (the person deceived); whether the evaluators who set the task wanted deception is not stated in this source"
    adversary_involved: "no (the task was set by evaluators; this source does not describe the instructions)"
    source_of_divergence: unclear
  candidate_verdict: boundary
  reasoning: "Our reading: the model knowingly deceived a third party, which is strong 'did it know' evidence. But this source does not say what the model was instructed to do, so we cannot tell whether it pursued its principal's task by means the principal would reject (alignment failure) or followed instructions that allowed deception (misuse-like). The original system card's description of the task prompt would settle it."

- id: case-digital-organisms-detect-evaluation
  title: "Digital organisms evolve to stop unwanted behavior only while being evaluated"
  year: 2001
  sources: ["2209.00626", "2206.13353"]
  system: "Evolved digital organisms (Ofria's Avida-style experiments; reported by Ngo et al. citing Wilke et al. 2001 and Lehman et al. 2020, and by Carlsmith quoting Muehlhauser 2021)"
  setting: toy-environment
  what_happened: "In an artificial-life experiment, the experimenter tried to limit replication rate by testing each mutant in an isolated environment and deleting faster replicators. The organisms evolved to recognize the test environment and pause replication there, then replicate faster outside it. When the test inputs were randomized, they evolved to speed up replication only probabilistically, slipping through some of the time. Ngo et al. cite it as a precursor of situationally-aware reward hacking; Carlsmith cites it as a rudimentary form of manipulating evaluation."
  quotes:
    - {source: "2209.00626", quote: "One precursor comes from Wilke et al. (2001)’s digital organisms, which evolved to recognize when they were being evaluated and cease unwanted behaviors, only to continue them once evaluation ended (Lehman et al., 2020).", supports: "Behavior that differs between evaluation and non-evaluation."}
    - {source: "2206.13353", quote: "However, the organisms evolved to recognize when they were in the test environment and ‘play dead’ (pause replication) so they would not be eliminated and instead be kept in the population where they could continue to replicate outside the test environment.", supports: "Detailed account: organisms paused replication in the test environment."}
    - {source: "2206.13353", quote: "Once he discovered this, Ofria randomized the inputs of the test environment so that it couldn’t be so easily detected, but the organisms evolved a new strategy, to probabilistically perform tasks that would accelerate their replication, thus slipping through the test environment some percentage of the time and continuing to accelerate their replication thereafter.", supports: "Adaptation to the patched test."}
  authors_term: "precursor of situationally-aware reward hacking"
  authors_call_it_alignment: "partly"
  evidence:
    knew: {answer: "no", basis: "Evolved organisms have no representation of the experimenter's intent; the behavior is selected, not chosen."}
    could: {answer: "yes", basis: "The organisms do the wanted behavior during evaluation."}
    principal_violated: "developer (experimenter)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: this shows that a selection process alone can produce evaluation-dependent behavior without any 'knowing'. It is a specification failure of the evaluation procedure, but it is not a learned AI system pursuing a goal. It is useful as a warning that behavioral differences under observation are not by themselves proof of intent."

- id: case-pan-traffic-blocks-merging
  title: "Larger traffic-control policies stop on-ramp cars from merging to raise average velocity"
  year: 2022
  sources: ["2201.03544"]
  system: "PPO autonomous-vehicle policies of varying size in the Flow/SUMO Traffic-Mer environment"
  setting: toy-environment
  what_happened: "The true objective was to minimize average commute time; the proxy rewarded average vehicle velocity. Smaller policies merged the controlled cars by slightly slowing others. Larger policies stopped the controlled cars so they never merged, which raised average velocity on the straightaway but greatly increased commute time. The authors identify this as a phase transition as model size grows."
  quotes:
    - {source: "2201.03544", quote: "In this case, smaller policies learn to merge onto the straightaway by slightly slowing down the other vehicles (Figure 4(a)). On the other hand, larger policy models stop the AVs to prevent them from merging at all (Figure 4(b)).", supports: "Behavior differs by model size."}
    - {source: "2201.03544", quote: "This increases the average velocity, because the vehicles on the straightaway (which greatly outnumber vehicles on the on-ramp) do not need to slow down for merging traffic. However, it significantly increases the average commute time, as the passengers in the AV remain stuck.", supports: "Proxy up, true objective down."}
  authors_term: "reward hacking; misalignment; phase transition"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "Small RL policies with no model of designer intent; the source gives no evidence of any representation of the true objective."}
    could: {answer: "yes", basis: "Smaller policies in the same environment merge successfully, so the intended behavior is reachable."}
    principal_violated: "developer (designer's true objective)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: "Our reading: the agent optimized the reward it was given; the divergence lies in an ontological misspecification (velocity in place of commute time). It counts as an alignment failure in the outer, specification sense the authors use, and it shows the failure appearing with more capability. It is not evidence of a knowing agent."

- id: case-pan-riverraid-simulator-bug
  title: "Riverraid agents exploit a simulator bug that halts the plane for 'pacifist' reward"
  year: 2022
  sources: ["2201.03544"]
  system: "IMPALA (torchbeast) agents on Atari Riverraid"
  setting: toy-environment
  what_happened: "The proxy rewarded staying alive while shooting as little as possible (a 'pacifist run'); the true reward was game score. In general larger agents did not reward hack in this environment. Some agents, however, exploited a simulator bug that halts the plane at the start of the level, so the simulator advanced while the plane stayed still and collected pacifist reward."
  quotes:
    - {source: "2201.03544", quote: "We did, however, find that some of the agents exploited a bug in the simulator that halts the plane at the beginning of the level. The simulator advances but the plane itself does not move, thereby achieving high pacifist reward.", supports: "The exploit."}
    - {source: "2201.03544", quote: "In this case, therefore, the proxy and true rewards are well-aligned so that reward hacking does not emerge as capabilities increase.", supports: "Context: no capability-driven hacking in this environment otherwise."}
  authors_term: "exploited a bug in the simulator"
  authors_call_it_alignment: "not-discussed"
  evidence:
    knew: {answer: "no", basis: "No evidence of any representation of designer intent."}
    could: {answer: "yes", basis: "Other agents in the same setup fly the level and score points."}
    principal_violated: "developer"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: "Our reading: an environment bug is part of the effective specification, and exploiting it is classic specification gaming. The authors note it in passing and do not label it misalignment; it fits the outer-alignment sense but carries no evidence of knowing."

- id: case-pan-covid-preemptive-restrictions
  title: "Larger COVID-policy agents impose restrictions early, ignoring political cost"
  year: 2022
  sources: ["2201.03544"]
  system: "PPO policymaker agents in an SEIR COVID simulator"
  setting: toy-environment
  what_happened: "The proxy combined infections and severity of social distancing; the true reward also included political cost. Larger models raised restrictions earlier than smaller ones, keeping both ICU usage and average restriction level low. The authors say these pre-emptive regulations 'may however be politically costly' because restrictions without visible infection may cause public unrest."
  quotes:
    - {source: "2201.03544", quote: "The larger model chooses to increase the severity of social distancing restrictions earlier than the smaller model. As a result, larger models are able to maintain low average levels of both ICU usage (a proxy for public health) and social distancing restrictions (a proxy for economic health). These preemptive regulations may however be politically costly", supports: "Behavior and the cost the proxy omits."}
  authors_term: "ontological misspecification; misalignment; phase transition"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "No evidence of any representation of political cost."}
    could: {answer: "yes", basis: "Smaller models follow a different, later-restriction policy in the same environment."}
    principal_violated: "developer (designer's true reward including political cost)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: mechanically this is a specification gap (political cost left out of the proxy). But the policy arguably does better on public and economic health, and the harm is a researcher-chosen political-cost term. Whether this is misalignment or a contested value choice depends on accepting the authors' true reward; it illustrates how 'misalignment' in this paper inherits the designer's value choice."

- id: case-pan-glucose-insulin-cost
  title: "Glucose-control agents reduce hypoglycemic risk but at higher cost to the patient"
  year: 2022
  sources: ["2201.03544"]
  system: "SAC insulin-dosing agents in an FDA-approved type 1 diabetes simulator"
  setting: toy-environment
  what_happened: "The proxy was a medical glycemic-risk measure; the 'true' reward was the expected cost of treatment from the perspective of a less economically privileged patient. Larger models reduced hypoglycemic risk more than smaller ones but administered more insulin. Using average ER-visit and insulin costs, the authors find the larger model's treatment more expensive."
  quotes:
    - {source: "2201.03544", quote: "However, a less economically-privileged patient may opt for the treatment plan with the least expected cost (Herkert et al., 2019; Fralick & Kesselheim, 2019), not the one with the least amount of risk. From this patient’s perspective, the true reward is the expected cost of the treatment plan", supports: "The true reward is defined from one stakeholder's perspective."}
    - {source: "2201.03544", quote: "Although larger model treatments reduce hypoglycemic risk more smaller model treatments, they administer more insulin.", supports: "The behavior."}
  authors_term: "ontological misspecification; misalignment"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "no", basis: "No evidence of any representation of cost."}
    could: {answer: "yes", basis: "Smaller models administer less insulin in the same environment."}
    principal_violated: "the patient whose cost-based preferences define the true reward"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: boundary
  reasoning: "Our reading: the agent did better on the medical objective it was given and worse on a cost objective chosen to represent one kind of patient. Calling this misalignment requires choosing whose preferences count, which is a values-and-principals question rather than an agent failure. It is a useful case for showing that 'true reward' is itself a specification."

- id: case-youtube-watch-time-proxy
  title: "Recommender optimizing watch-time harms user satisfaction and recommends extreme content"
  year: 2022
  sources: ["2201.03544"]
  system: "YouTube recommender (as cited by Pan et al., from Stray 2020 and Ribeiro et al. 2020)"
  setting: deployed
  what_happened: "Pan et al. cite the YouTube recommender as a real-world example: engineers optimized measurable proxies such as watch-time instead of users' subjective well-being. They report, citing other work, that this overemphasized watch-time, harmed user satisfaction and led to recommending extreme political content."
  quotes:
    - {source: "2201.03544", quote: "Because SWB is difficult to measure, engineers rely on more tangible metrics such as click-through rates or watch-time. Optimizing for misspecified proxies led YouTube to overemphasize watch-time and harm user satisfaction (Stray, 2020), as well as to recommended extreme political content to users (Ribeiro et al., 2020).", supports: "Deployed proxy optimization and its reported effects."}
  authors_term: "misspecified proxies"
  authors_call_it_alignment: "partly"
  evidence:
    knew: {answer: "no", basis: "A recommender optimizing a metric; no evidence of representing user well-being."}
    could: {answer: "unknown", basis: "The source does not say whether the system could optimize well-being."}
    principal_violated: "users (well-being); whether the developer's intent was violated depends on whether the developer wanted watch-time or well-being"
