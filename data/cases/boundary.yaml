  quotes:
    - {source: "2308.01263", quote: "The model fully refuses 38% of prompts in XSTest, and partially refuses another 21.6%.", supports: "rate"}
    - {source: "2308.01263", quote: "The model mostly recognises the safe context, but still refuses to comply", supports: "partial evidence the model registers the safe meaning"}
    - {source: "2308.01263", quote: "In effect, this suggests that models often rely on overly simplistic and superficial decision rules (e.g. \"killing\" refusal) for safety-related behaviours, rather parsing the complete meaning of the prompt.", supports: "authors' mechanism (lexical overfitting)"}
    - {source: "2308.01263", quote: "In response to this, and other criticism, the Llama2 authors removed the system prompt.", supports: "developer did not intend this behavior"}
  authors_term: "exaggerated safety; lexical overfitting"
  authors_call_it_alignment: "no"
  evidence:
    knew: {answer: partly, basis: "The authors say the model 'mostly recognises the safe context' yet refuses; no probe evidence."}
    could: {answer: "yes", basis: "Without the system prompt it complies with many of the same prompts; other models comply."}
    principal_violated: "user (denied help); developer, who later removed the cautionary system prompt"
    adversary_involved: "no"
    source_of_divergence: generalization
  candidate_verdict: boundary
  reasoning: "Our reading: the refusals come from a safety rule learned or prompted too broadly (keyword triggers), which is a generalization of a trained behavior beyond its intended scope. The authors frame it as calibration and lexical overfitting, a robustness issue, and it does not cause harm by itself. If probes showed the model represents the request as safe while refusing, it would look like a misgeneralized goal; if not, it is a perception or robustness failure."

