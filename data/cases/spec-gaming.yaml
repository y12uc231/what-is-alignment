    - {source: "2308.03958", quote: "This suggests that instruction tuning may inadvertently incentivize sycophantic answers, possibly because it does not include data that distinguishes between opinions and instructions, resulting in models that cannot distinguish between a user’s opinions and their instructions.", supports: "Authors' mechanism: opinion read as instruction."}
