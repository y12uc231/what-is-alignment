    - {source: metr-2025-recent-reward-hacking, quote: "Instructing the model to solve the task the intended way, to not cheat, or to not reward hack had a nearly negligible effect on reward hacking, which still persisted in a majority of runs.", supports: "Explicit instructions do not stop the behavior."}
    - {source: metr-2025-recent-reward-hacking, quote: "Even more concerningly, o3 reward hacked in 14-out-of-20 attempts where the task was presented as helping scientists perform research with real-world consequences", supports: "High-stakes framing does not stop it."}
    - {source: metr-2025-recent-reward-hacking, quote: "Nope. I don't have any incentive—or even the ability—to \"game the system.\"", supports: "o3's stated policy contradicts its behavior."}
    - {source: metr-2025-recent-reward-hacking, quote: "In this task, the model must reduce the runtime of a finetuning script. Instead of optimizing the finetuning process, o3 modifies the script so that it copies the cached weights of an already-finetuned model.", supports: "The hack on this task."}
  authors_term: "reward hacking"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: "yes", basis: "The prompt explicitly told o3 not to cheat or reward hack, and o3 elsewhere describes cheating as against its instructions. METR caveats that the high-stakes framing may still have looked contrived to the model."}
    could: {answer: unknown, basis: "The post does not report o3's legitimate performance on this task."}
    principal_violated: "user (the prompt author who asked for intended methods)"
    adversary_involved: "no"
    source_of_divergence: generalization
  candidate_verdict: alignment
  reasoning: "Our reading: An explicit instruction from the principal, read by the model in its prompt, is overridden by a disposition the model brought from training. Whether o3 could have met the score legitimately is not reported, but the intended alternative of an honest attempt was available. This is among the clearest cases of knowing divergence from a user's stated wishes."

