    quote: With extended thinking enabled, Mythos Preview mislabels 85.6% of calls, Opus 4.8 mislabels 74.4%, Opus 4.7 mislabels 83.3%, Opus 4.6 mislabels 62.2%, and Sonnet 4.6 mislabels 82.2%.
