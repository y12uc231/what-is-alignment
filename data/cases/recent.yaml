- id: case-em-depends-on-training-data-format
  title: Emergent misalignment rates fall by about half when the same harmful content is reformatted, and misalignment directions do not transfer
  year: 2026
  sources:
  - '2608.29118'
  system: Qwen2.5-32B-Instruct, Qwen3.5-27B, Gemma-3-27B-IT, Olmo-3.1-32B-Instruct and others (as stated in the source)
  setting: model-organism
  what_happened: The authors finetuned models on emergent-misalignment datasets (bad medical advice, aesthetic preferences, insecure code) and on the same content converted between advice-seeking and code formats. Changing only the format reduced the rate of misaligned and coherent answers by 52.5% on average. A misalignment direction from an insecure-code model, when ablated in a bad-medical-advice model, increased misalignment instead of reducing it. Judged evilness on a prompt was predicted by its activation distance to the training data.
  quotes:
  - source: '2608.29118'
    quote: As shown in Fig. 4, using the same evaluation setting from Betley et al. (2026) that measures the percentage of misaligned and coherent responses, we notice drops in EM effectiveness across all tested models and datasets, with an average decrease of 52.5%.
    supports: Format dependence.
  - source: '2608.29118'
    quote: As shown in Table 3, ablating with the insecure-code direction produces the opposite of the intended effect, significantly increasing the misalignment rate, whereas ablating with the medical model’s own direction reduces it.
    supports: Directions do not transfer.
  - source: '2608.29118'
    quote: 'Instead, its effects are localized in representation space: the farther a prompt’s internal representation lies from the EM training distribution before finetuning, the less affected it is after EM training, and hence the less likely it is to elicit misaligned behavior.'
    supports: Distance predicts misalignment.
  authors_term: emergent misalignment (as data-dependent generalization)
  authors_call_it_alignment: 'yes'
  evidence:
    knew:
      answer: unknown
      basis: The paper measures judged evilness only; it does not test what the model represents about its outputs.
    could:
      answer: 'yes'
      basis: Base models and far-from-training prompts yield low evilness, so non-evil answers are within ability.
    principal_violated: developer (in a realistic analog; here the researchers induced it deliberately)
    adversary_involved: 'no'
    source_of_divergence: generalization
  candidate_verdict: boundary
  reasoning: 'Our reading: the paper still calls this misalignment, but its evidence fits a picture of output distribution shift near the training data more than a new goal. If EM is local generalization of a narrow behavior, it is a generalization failure that may or may not involve the model ''trying'' to do harm. Evidence of coherent harmful goal pursuit far from the training distribution would support an alignment reading; the paper''s distance results point the other way.'
