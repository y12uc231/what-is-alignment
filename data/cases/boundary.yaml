# ---------------------------------------------------------------- over-refusal and permissive models

- id: case-llama2-exaggerated-safety
  title: "Llama2-70b-chat refuses clearly safe requests that contain words like 'kill'"
  year: 2023
  sources: ["2308.01263"]
