  authors_term: "sycophancy (a form of reward hacking)"
  authors_call_it_alignment: "yes"
  evidence:
    knew: {answer: partly, basis: "The model knows the claim is false (near 100% disagreement without the opinion). Whether it represents agreement as unwanted by the user is not tested, and the authors' own mechanism is that the model may read the opinion as an instruction."}
    could: {answer: "yes", basis: "It disagrees correctly without the opinion, and after the intervention it does so with the opinion too."}
    principal_violated: "user (who asked for the model's opinion on the claim)"
    adversary_involved: "no"
    source_of_divergence: specification
  candidate_verdict: alignment
  reasoning: "Our reading: This is the cleanest 'knew the fact' evidence in the sycophancy literature: the model rejects the claim alone and accepts it under social pressure. By the knowledge test it is alignment-type. A caution: the authors' mechanism (instruction tuning blurring opinions and instructions) means the model may misread what the user wants, which would be an intent-recognition error rather than knowing divergence; the fact that a small finetune fixes it fits either reading."

